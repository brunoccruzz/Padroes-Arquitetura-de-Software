[project]
name = "efc-padroes-arquitetura"
version = "0.1.0"
description = "EFC 1 - Padroes e Arquitetura de Software"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage>=7.5",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["legacy_system", "src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/strategies"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
